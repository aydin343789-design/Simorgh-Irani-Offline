plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.simorgh.irani'
    compileSdk 36

    defaultConfig {
        applicationId 'ir.simorgh.irani'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'com.capacitorjs:capacitor-android:8.5.2'
    implementation 'com.google.mlkit:translate:17.0.3'
}
