name: Build signed Galaxy A04 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install dependencies and sync
        run: npm ci && npm run sync
      - name: Create release signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/simorgh-release.jks" \
            -storepass 'SimorghA04Release2026' \
            -keypass 'SimorghA04Release2026' \
            -alias simorgh-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=SIMURGH, OU=Mobile, O=SIMURGH, L=Tehran, ST=Tehran, C=IR'
      - name: Build signed arm64 release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease \
            -PreleaseStoreFile="$RUNNER_TEMP/simorgh-release.jks" \
            -PreleaseStorePassword='SimorghA04Release2026' \
            -PreleaseKeyAlias='simorgh-release' \
            -PreleaseKeyPassword='SimorghA04Release2026'
      - name: Verify APK contents
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          unzip -tq android/app/build/outputs/apk/release/app-release.apk
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep 'lib/arm64-v8a/'
          if unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -E 'lib/(armeabi-v7a|x86|x86_64)/'; then exit 1; fi
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SIMURGH-Galaxy-A04-arm64-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
