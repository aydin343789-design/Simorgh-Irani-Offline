name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create simorgh com.simorgh.iranioffline "Simorgh Irani Offline"
          cp -r www/* simorgh/www/ || true
          cd simorgh
          cordova platform add android

      - name: Build APK
        run: |
          cd simorgh
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Simorgh-APK
          path: simorgh/platforms/android/app/build/outputs/apk/debug/*.apk
