name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install dependencies and prepare offline TTS assets
        run: npm ci && npm run sync
      - name: Verify prepared voice asset
        run: test -s android/app/src/main/assets/tts/tts-en.zip && unzip -tq android/app/src/main/assets/tts/tts-en.zip
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK contains offline English voice
        run: unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/tts/tts-en.zip'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Simorgh-APK
          path: android/app/build/outputs/apk/debug/*.apk
