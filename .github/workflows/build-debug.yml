name: Build SIMURGH APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare model and sync Capacitor assets
        run: npm run sync

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Validate Android project and model assets
        shell: bash
        run: |
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/ir/simorgh/irani/MainActivity.java
          test -f android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/tts/tts-en.zip
          unzip -tq android/app/src/main/assets/tts/tts-en.zip
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK contains English offline TTS
        run: unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/tts/tts-en.zip'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIMURGH-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
